<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proteus</title>
<style>
  :root {
    --bg: #14161b; --panel: #1b1e25; --panel2: #222630; --line: #2d3240; --text: #d9dde7; --dim: #8b93a7;
    --accent: #5aa2ff; --good: #5fd08a; --bad: #ff6b6b; --warn: #f0b84a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, Segoe UI, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); height: 44px; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .5px; }
  header .sp { flex: 1; }
  button, select, input, textarea { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #07101d; border-color: var(--accent); font-weight: 600; }
  #app { display: grid; grid-template-columns: 400px 1fr 330px; grid-template-rows: 1fr 210px; height: calc(100% - 44px); }
  section { background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: auto; min-height: 0; }
  #left { grid-row: 1 / span 2; display: flex; flex-direction: column; }
  #center { display: flex; flex-direction: column; background: #101217; }
  #right { padding: 10px; }
  #bottom { grid-column: 2 / span 2; padding: 6px; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { padding: 8px 14px; cursor: pointer; color: var(--dim); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--text); border-color: var(--accent); }
  .pane { flex: 1; min-height: 0; overflow: auto; padding: 8px; }
  textarea#code { width: 100%; height: 55%; resize: vertical; font-family: Consolas, monospace; font-size: 12.5px; white-space: pre; tab-size: 4; }
  #results { margin-top: 8px; font-family: Consolas, monospace; font-size: 12px; }
  .err { color: var(--bad); } .ok { color: var(--good); } .warn { color: var(--warn); } .dim { color: var(--dim); }
  .row { margin: 3px 0; padding: 4px 6px; border-radius: 4px; background: var(--panel2); }
  svg text { fill: var(--text); font-size: 12px; pointer-events: none; }
  svg .node rect { fill: var(--panel2); stroke: var(--line); rx: 6; cursor: pointer; }
  svg .node.sel rect { stroke: var(--accent); stroke-width: 2; }
  svg .node.view rect { fill: #243349; }
  svg .kind { fill: var(--dim); font-size: 10px; }
  svg path.edge { fill: none; stroke: #4a5167; stroke-width: 1.5; }
  #viewbar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #viewwrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  #view { max-width: 100%; max-height: 100%; cursor: grab; user-select: none; -webkit-user-drag: none; }
  #viewmsg { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; }
  .param { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; margin: 5px 0; }
  .param label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .param input, .param textarea { width: 100%; }
  .doc { grid-column: 1 / span 2; color: var(--dim); font-size: 11px; margin-top: -2px; }
  table { border-collapse: collapse; font-family: Consolas, monospace; font-size: 11.5px; }
  th, td { border: 1px solid var(--line); padding: 2px 8px; text-align: right; }
  th { background: var(--panel2); position: sticky; top: 0; }
  h3 { margin: 6px 0; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>PROTEUS</h1>
  <button id="undo">Undo</button><button id="redo">Redo</button>
  <label class="dim">frame <input id="frame" type="number" step="1" value="1" style="width:64px"></label>
  <select id="recipes"><option value="">recipes…</option></select>
  <span class="sp"></span>
  <span id="status" class="dim"></span>
  <span class="dim" title="Edits made here are visible to a connected agent, and its edits appear here.">live session</span>
</header>
<div id="app">
  <section id="left">
    <div class="tabs"><div class="tab on" data-tab="graph">Graph</div><div class="tab" data-tab="code">Code (hcs)</div></div>
    <div class="pane" id="pane-graph"><svg id="graph" width="100%" height="400"></svg><div id="diag"></div></div>
    <div class="pane" id="pane-code" style="display:none">
      <textarea id="code" spellcheck="false" placeholder="ground = grid(size=[20, 20])&#10;out(ground)"></textarea>
      <div style="margin-top:6px; display:flex; gap:6px">
        <button class="primary" id="run">Run</button><button id="check">Check</button><button id="tocode">Graph → code</button>
      </div>
      <div id="results"></div>
    </div>
  </section>
  <section id="center">
    <div id="viewbar">
      <span class="dim">view</span><b id="viewnode">-</b>
      <select id="mode"><option>shaded</option><option>wire</option><option>height</option><option>Cd</option></select>
      <button id="pt">Path trace</button>
      <label class="dim">spp <input id="spp" type="number" value="24" min="1" max="128" style="width:56px"></label>
      <span class="dim">drag to orbit</span>
    </div>
    <div id="viewwrap"><img id="view" alt="viewport" draggable="false"><div id="viewmsg"></div></div>
  </section>
  <section id="right"><div id="params"><span class="dim">Select a node.</span></div></section>
  <section id="bottom"><div id="sheet"><span class="dim">Spreadsheet: point attributes of the viewed node.</span></div></section>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const S = { state: null, schemas: {}, sel: null, rev: '', az: 35, el: 28, pt: false, busy: false, again: false };

async function api(name, args) {
  const r = await fetch('/api/call', { method: 'POST', body: JSON.stringify({ name, arguments: args || {} }) });
  return r.json();
}
function say(msg, cls) { const s = $('#status'); s.textContent = msg; s.className = cls || 'dim'; }
function niceError(e) {
  try { const j = JSON.parse(e); if (j.errors) return j.errors.map((d) => `${d.line}:${d.col} ${d.message}  (fix: ${d.fix})`).join('\n'); } catch (_) {}
  return String(e);
}

// ---- graph drawing ----
function depthMap(nodes) {
  const memo = {};
  const d = (id, seen) => {
    if (memo[id] !== undefined) return memo[id];
    if (seen.has(id)) return 0;
    seen.add(id);
    let m = 0;
    for (const up of nodes[id].inputs) if (up && nodes[up]) m = Math.max(m, d(up, seen) + 1);
    return (memo[id] = m);
  };
  Object.keys(nodes).forEach((id) => d(id, new Set()));
  return memo;
}
function drawGraph() {
  const nodes = S.state.nodes, ids = Object.keys(nodes), svg = $('#graph');
  if (!ids.length) { svg.innerHTML = '<text x="10" y="24" style="fill:#8b93a7">Empty scene. Use the Code tab.</text>'; svg.setAttribute('height', 60); return; }
  const dm = depthMap(nodes), cols = {};
  ids.forEach((id) => (cols[dm[id]] = cols[dm[id]] || []).push(id));
  const pos = {};
  let maxRows = 0;
  Object.keys(cols).forEach((c) => { cols[c].forEach((id, i) => (pos[id] = { x: 14 + c * 190, y: 14 + i * 58 })); maxRows = Math.max(maxRows, cols[c].length); });
  const W = 14 + (Object.keys(cols).length) * 190, H = 28 + maxRows * 58;
  svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${Math.max(W, 380)} ${H}`);
  let out = '';
  ids.forEach((id) => nodes[id].inputs.forEach((up, slot) => {
    if (!up || !pos[up]) return;
    const a = pos[up], b = pos[id], x1 = a.x + 164, y1 = a.y + 20, x2 = b.x, y2 = b.y + 12 + slot * 8;
    out += `<path class="edge" d="M${x1},${y1} C${x1 + 40},${y1} ${x2 - 40},${y2} ${x2},${y2}"/>`;
  }));
  ids.forEach((id) => {
    const p = pos[id], n = nodes[id];
    out += `<g class="node${S.sel === id ? ' sel' : ''}" data-id="${esc(id)}"><rect x="${p.x}" y="${p.y}" width="164" height="42"/><text class="kind" x="${p.x + 8}" y="${p.y + 15}">${esc(n.kind)}</text><text x="${p.x + 8}" y="${p.y + 31}">${esc(id)}</text></g>`;
  });
  svg.innerHTML = out;
  svg.querySelectorAll('.node').forEach((g) => g.addEventListener('click', () => select(g.dataset.id)));
}

// ---- params ----
function fmt(v) { return Array.isArray(v) ? v.map(fmt).join(', ') : typeof v === 'object' && v !== null ? JSON.stringify(v) : String(v); }
function parseParam(def, text) {
  if (Array.isArray(def)) return text.split(',').map((t) => { t = t.trim(); return t.startsWith('=') ? t : Number(t); });
  if (typeof def === 'number') { const t = text.trim(); return t.startsWith('=') ? t : Number(t); }
  if (typeof def === 'object' && def !== null) return JSON.parse(text);
  return text;
}
function drawParams() {
  const box = $('#params');
  if (!S.sel || !S.state.nodes[S.sel]) { box.innerHTML = '<span class="dim">Select a node.</span>'; return; }
  const n = S.state.nodes[S.sel], sc = S.schemas[n.kind];
  let h = `<h3>${esc(S.sel)} <span class="dim">· ${esc(n.kind)}</span></h3>`;
  if (sc) h += `<div class="dim" style="margin-bottom:8px">${esc(sc.doc)}</div>`;
  (sc ? sc.params : []).forEach((p) => {
    const cur = n.params[p.name] !== undefined ? n.params[p.name] : p.default;
    const multi = typeof p.default === 'object' && !Array.isArray(p.default) && p.default !== null || (typeof p.default === 'string' && p.name === 'code');
    h += `<div class="param"><label title="${esc(p.name)}">${esc(p.name)}</label>` +
      (multi ? `<textarea rows="4" data-p="${esc(p.name)}">${esc(typeof cur === 'object' ? JSON.stringify(cur, null, 1) : cur)}</textarea>` : `<input data-p="${esc(p.name)}" value="${esc(fmt(cur))}">`) +
      `<div class="doc">${esc(p.doc)}</div></div>`;
  });
  h += `<div style="margin-top:10px;display:flex;gap:6px"><button id="del">Delete node</button></div>`;
  box.innerHTML = h;
  box.querySelectorAll('[data-p]').forEach((el) => el.addEventListener('change', async () => {
    const p = sc.params.find((x) => x.name === el.dataset.p);
    let value;
    try { value = parseParam(p.default, el.value); } catch (e) { say('bad value: ' + e.message, 'err'); return; }
    const r = await api('set_param', { node: S.sel, name: p.name, value });
    if (!r.ok) say(niceError(r.error), 'err'); else say('set ' + p.name, 'ok');
    await refresh(true);
  }));
  const del = $('#del');
  if (del) del.addEventListener('click', async () => { await api('delete_node', { node: S.sel }); S.sel = null; await refresh(true); });
}

// ---- viewport ----
function viewNode() { return S.sel && S.state.nodes[S.sel] ? S.sel : sinks()[0]; }
function sinks() {
  const nodes = S.state.nodes, used = new Set();
  Object.values(nodes).forEach((n) => n.inputs.forEach((u) => u && used.add(u)));
  return Object.keys(nodes).filter((id) => !used.has(id)).reverse();
}
function loadView() {
  const node = viewNode();
  $('#viewnode').textContent = node || '-';
  if (!node) { $('#view').removeAttribute('src'); return; }
  if (S.busy) { S.again = true; return; }
  S.busy = true;
  const mode = encodeURIComponent($('#mode').value);
  const pt = S.pt ? `&pt=1&spp=${encodeURIComponent($('#spp').value)}` : '';
  const url = `/api/render?node=${encodeURIComponent(node)}&az=${S.az.toFixed(1)}&el=${S.el.toFixed(1)}&mode=${mode}&w=900&h=640${pt}&_=${S.rev}`;
  const img = $('#view');
  $('#viewmsg').textContent = S.pt ? 'path tracing…' : '';
  img.onload = () => { S.busy = false; $('#viewmsg').textContent = ''; if (S.again) { S.again = false; loadView(); } };
  img.onerror = async () => {
    S.busy = false;
    try { const j = await (await fetch(url)).json(); $('#viewmsg').textContent = niceError(j.error || 'render failed'); } catch (_) { $('#viewmsg').textContent = 'render failed'; }
  };
  img.src = url;
}
async function loadSheet() {
  const node = viewNode();
  if (!node) { $('#sheet').innerHTML = ''; return; }
  const g = await (await fetch(`/api/geo?node=${encodeURIComponent(node)}&n=150`)).json();
  if (g.error) { $('#sheet').innerHTML = `<span class="err">${esc(niceError(g.error))}</span>`; return; }
  let h = `<div class="dim" style="margin-bottom:4px">${esc(node)}: ${g.points} points, ${g.primitives} primitives, ${g.instances} instances (first ${g.rows.length} points)</div><table><tr>${g.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr>`;
  g.rows.forEach((r) => { h += '<tr>' + r.map((v, i) => `<td>${i === 0 ? v : (typeof v === 'number' ? v.toFixed(3) : esc(v))}</td>`).join('') + '</tr>'; });
  $('#sheet').innerHTML = h + '</table>';
}

// ---- state ----
function select(id) { S.sel = id; drawGraph(); drawParams(); loadView(); loadSheet(); }
function drawDiag() {
  const d = S.state.diagnostics || [];
  $('#diag').innerHTML = d.length ? '<h3>Checks</h3>' + d.map((x) => `<div class="row err">${esc(x.node)}: ${esc(x.message)}<div class="dim">fix: ${esc(x.fix)}</div></div>`).join('') : '<div class="row ok">attribute-flow check: clean</div>';
}
async function refresh(force) {
  const st = await (await fetch('/api/state')).json();
  if (!force && st.rev === S.rev) return;
  S.state = st; S.rev = st.rev;
  if (S.sel && !st.nodes[S.sel]) S.sel = null;
  $('#frame').value = st.frame;
  drawGraph(); drawDiag(); drawParams(); loadView(); loadSheet();
}
async function init() {
  const sc = await (await fetch('/api/schemas')).json();
  sc.forEach((s) => (S.schemas[s.kind] = s));
  const rl = await api('list_recipes');
  if (rl.ok) rl.result.forEach((r) => { const o = document.createElement('option'); o.value = r.name; o.textContent = r.name.replace(/_/g, ' '); $('#recipes').appendChild(o); });
  await refresh(true);
  setInterval(() => refresh(false).catch(() => say('connection lost', 'err')), 1000);
}

// ---- events ----
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
  $('#pane-graph').style.display = t.dataset.tab === 'graph' ? '' : 'none';
  $('#pane-code').style.display = t.dataset.tab === 'code' ? '' : 'none';
}));
function showResults(r) {
  const box = $('#results');
  if (!r.ok) { box.innerHTML = `<div class="row err">${esc(niceError(r.error)).replace(/\n/g, '<br>')}</div>`; return; }
  const v = r.result; let h = '';
  if (v.errors) h += v.errors.map((d) => `<div class="row err">${d.line}:${d.col} ${esc(d.message)}<div class="dim">fix: ${esc(d.fix)}</div></div>`).join('');
  (v.diagnostics || v.flow_diagnostics || []).forEach((d) => (h += `<div class="row err">${esc(d.message || d)}${d.fix ? `<div class="dim">fix: ${esc(d.fix)}</div>` : ''}</div>`));
  (v.specs || []).forEach((s) => (h += `<div class="row ${s.ok ? 'ok' : 'err'}">${s.ok ? '✓' : '✗'} ${esc(s.spec)}: ${esc(s.message)}</div>`));
  if (!h) h = '<div class="row ok">ok</div>';
  box.innerHTML = h;
}
$('#run').addEventListener('click', async () => { const r = await api('run_hcs', { code: $('#code').value }); showResults(r); say(r.ok && r.result.ok ? 'ran: all specs pass' : 'ran with issues', r.ok ? 'ok' : 'err'); await refresh(true); });
$('#check').addEventListener('click', async () => { showResults(await api('check_hcs', { code: $('#code').value })); });
$('#tocode').addEventListener('click', async () => { const r = await api('graph_to_hcs'); if (r.ok) $('#code').value = r.result.code; });
$('#undo').addEventListener('click', async () => { await api('undo'); await refresh(true); });
$('#redo').addEventListener('click', async () => { await api('redo'); await refresh(true); });
$('#frame').addEventListener('change', async () => { await api('set_frame', { frame: Number($('#frame').value) }); await refresh(true); });
$('#mode').addEventListener('change', loadView);
$('#pt').addEventListener('click', () => { S.pt = true; loadView(); });
$('#recipes').addEventListener('change', async (e) => {
  if (!e.target.value) return;
  const r = await api('get_recipe', { name: e.target.value });
  if (r.ok) { $('#code').value = r.result.code; document.querySelector('.tab[data-tab="code"]').click(); }
  e.target.value = '';
});
// Orbit: drag on the image.
(() => {
  let down = null;
  const img = $('#view');
  img.addEventListener('mousedown', (e) => { down = { x: e.clientX, y: e.clientY, az: S.az, el: S.el }; img.style.cursor = 'grabbing'; e.preventDefault(); });
  window.addEventListener('mouseup', () => { down = null; img.style.cursor = 'grab'; if (S.pt) { /* keep the cheap preview while orbiting */ } });
  window.addEventListener('mousemove', (e) => {
    if (!down) return;
    S.pt = false;
    S.az = down.az - (e.clientX - down.x) * 0.4;
    S.el = Math.max(-85, Math.min(85, down.el + (e.clientY - down.y) * 0.4));
    loadView();
  });
})();
init().catch((e) => say('failed to load: ' + e, 'err'));
</script>
</body>
</html>
