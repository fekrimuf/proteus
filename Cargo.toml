[workspace]
resolver = "2"
members = ["crates/pt-core", "crates/pt-vex", "crates/pt-sim", "crates/pt-sop", "crates/pt-graph", "crates/pt-hcs", "crates/pt-opt", "crates/pt-render", "crates/pt-cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rayon = "1"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
png = "0.17"
pt-core = { path = "crates/pt-core" }
pt-vex = { path = "crates/pt-vex" }
pt-sim = { path = "crates/pt-sim" }
pt-sop = { path = "crates/pt-sop" }
pt-graph = { path = "crates/pt-graph" }
pt-hcs = { path = "crates/pt-hcs" }
pt-opt = { path = "crates/pt-opt" }
pt-render = { path = "crates/pt-render" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
debug = false

# Vendored copies of the physics math stack, patched so every transcendental function (sin, cos,
# acos, log2, ...) on the simulation path goes through the pure-software `libm` crate. The std
# versions call each operating system's C library, which rounds differently on Windows vs
# Linux/macOS and made rigid-body results differ across platforms (see docs/STATUS.md).
[patch.crates-io]
rapier3d = { path = "vendor/rapier3d" }
parry3d = { path = "vendor/parry3d" }
glamx = { path = "vendor/glamx" }

# No crash-prone shortcuts in production code (DECISIONS B19): a bad input must come back as an error the agent can read, never as a
# panic. Test code may use them (clippy.toml). A line that truly cannot fail gets `#[allow(clippy::...)]` with the reason, and the
# gate (`pt gate`) runs these lints on every library and binary.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
